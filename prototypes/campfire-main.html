<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Campfire Loop</title>
<style>
:root { --bg: #150f1d; color-scheme: dark; }
html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c" role="img" aria-label="Animated campfire on open ground with rising smoke"></canvas>
<script>
(() => {
const W = 1000, H = 750;            // design space
const FIRE_X = 500, FIRE_Y = 655;   // flame base
// ---------- palette ----------
const theme = {
  bg: '#150f1d',
  ground: ['#6a8197', '#4c6176', '#2a3346', '#150f1d'],
  smoke: [[66, 80, 112], [228, 235, 248]], glow: 1, grain: .09,
};
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

// seeded rng so the static scene is stable across resizes
let seed = 7;
const rnd = () => ((seed = (seed * 16807) % 2147483647) - 1) / 2147483646;
const R = (a, b) => a + rnd() * (b - a);
const wob = (t, s) => Math.sin(t * 1.7 + s) * .5 + Math.sin(t * 3.1 + s * 2.3) * .3 + Math.sin(t * 7.3 + s * .7) * .2;

let VT, VB, VL, VR, dpr, scale, ox, oy, staticLayer, smokeLayer, smokeBase, fireLayer, frontLogLayer, speckPattern, streakPattern, smokeGrain, grains = [];

function mkCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function toDesign(g) { g.setTransform(dpr * scale, 0, 0, dpr * scale, dpr * ox, dpr * oy); }

// ---------- static scene ----------
function buildStatic() {
  seed = 7;
  const g = staticLayer.getContext('2d');
  toDesign(g);
  g.fillStyle = theme.bg; g.fillRect(VL - 10, VT - 10, VR - VL + 20, VB - VT + 20);
  // ground: a clearing lit from the fire, fading into the dark at the edges
  const gg = g.createRadialGradient(FIRE_X, 650, 20, FIRE_X, 690, 520);
  [0, .4, .75, 1].forEach((o, i) => gg.addColorStop(o, theme.ground[i]));
  g.fillStyle = gg; g.beginPath();
  g.moveTo(VL - 10, VB + 10); g.lineTo(VL - 10, 660);
  g.bezierCurveTo(150, 610, 330, 588, 500, 588); g.bezierCurveTo(670, 588, 850, 610, VR + 10, 660);
  g.lineTo(VR + 10, VB + 10); g.closePath(); g.fill();

  drawBackLogs(g);

  sprinkle(g);
}

// texture: light + dark speckle clipped to what's painted
function sprinkle(g) {
  g.globalCompositeOperation = 'source-atop';
  for (let i = 0, n = 14000 * (VR - VL) * (VB - VT) / (W * H); i < n; i++) {
    g.fillStyle = `rgba(215,225,250,${R(.05, .22)})`;
    const s = R(.5, 1.6); g.fillRect(R(VL, VR), R(VT, VB), s, s);
  }
  for (let i = 0, n = 9000 * (VR - VL) * (VB - VT) / (W * H); i < n; i++) {
    g.fillStyle = `rgba(12,8,22,${R(.15, .4)})`;
    const s = R(.6, 1.8); g.fillRect(R(VL, VR), R(VT, VB), s, s);
  }
  g.globalCompositeOperation = 'source-over';
}

// grainy holes punched into the smoke
function buildSpeck() {
  const c = mkCanvas(256, 256), g = c.getContext('2d');
  for (let i = 0; i < 4200; i++) { g.fillStyle = `rgba(0,0,0,${R(.3, 1)})`; const s = R(.6, 1.8); g.fillRect(R(0, 256), R(0, 256), s, s); }
  return c;
}

// a few frames of full-screen film grain, cycled at a low frame rate
function buildGrain() {
  grains = [];
  const w = Math.ceil(canvas.width / 2), h = Math.ceil(canvas.height / 2);
  for (let k = 0; k < 4; k++) {
    const c = mkCanvas(w, h), g = c.getContext('2d'), img = g.createImageData(w, h), d = img.data;
    for (let i = 0; i < d.length; i += 4) { const v = Math.random() * 255; d[i] = d[i+1] = d[i+2] = v; d[i+3] = 255; }
    g.putImageData(img, 0, 0); grains.push(c);
  }
}

function resize() {
  if (!innerWidth || !innerHeight) return;   // hidden/zero-size window: wait for a real size
  dpr = Math.min(devicePixelRatio || 1, 2);
  canvas.width = innerWidth * dpr; canvas.height = innerHeight * dpr;
  scale = Math.min(innerWidth / W, innerHeight / H);
  ox = (innerWidth - W * scale) / 2; oy = (innerHeight - H * scale) / 2;
  VT = -oy / scale; VB = H + oy / scale; VL = -ox / scale; VR = W + ox / scale;
  staticLayer = mkCanvas(canvas.width, canvas.height);
  smokeLayer = mkCanvas(canvas.width, canvas.height);
  smokeBase = mkCanvas(Math.ceil(canvas.width / 2), Math.ceil(canvas.height / 2));
  fireLayer = mkCanvas(canvas.width, canvas.height);
  frontLogLayer = mkCanvas(canvas.width, canvas.height);
  { const g = frontLogLayer.getContext('2d'); toDesign(g); drawFrontLogs(g); sprinkle(g); }
  buildStatic(); buildGrain();
  speckPattern = smokeLayer.getContext('2d').createPattern(buildSpeck(), 'repeat');
  streakPattern = smokeLayer.getContext('2d').createPattern(buildStreaks(), 'repeat');
  smokeGrain = buildSmokeGrain(smokeLayer.getContext('2d'));
}

// ---------- animated parts ----------
// Logs: a teepee of two dark logs behind the flame, a long log across the front with a
// pale cut end, and a lighter one underneath on the left. Light wavy grain runs along each.
function log(g, x1, y1, x2, y2, th, top, bot, opts = {}) {
  const L = Math.hypot(x2 - x1, y2 - y1), a = Math.atan2(y2 - y1, x2 - x1), r = th / 2;
  g.save(); g.translate(x1, y1); g.rotate(a);
  const lg = g.createLinearGradient(0, -r, 0, r);
  lg.addColorStop(0, top); lg.addColorStop(1, bot);
  g.fillStyle = lg; g.beginPath(); g.roundRect(0, -r, L, th, r); g.fill();
  g.strokeStyle = opts.grain || 'rgba(132,142,178,.6)'; g.lineWidth = 1.8; g.lineCap = 'round';
  for (const [v, s0, s1] of opts.lines || []) {   // v: offset across the log (-1..1), s0..s1: span along it (0..1)
    g.beginPath();
    for (let k = 0; k <= 16; k++) {
      const s = s0 + (s1 - s0) * k / 16, x = s * L, y = v * r * .7 + Math.sin(s * 9 + v * 5) * 2.2;
      k ? g.lineTo(x, y) : g.moveTo(x, y);
    }
    g.stroke();
  }
  if (opts.cap) {   // cut end: pale disc with a growth ring
    g.fillStyle = '#5a6884'; g.beginPath(); g.ellipse(L - r * .55, 0, r * .62, r * .98, 0, 0, 7); g.fill();
    g.strokeStyle = '#2b2f47'; g.lineWidth = 2.4; g.beginPath(); g.ellipse(L - r * .55, 1, r * .3, r * .5, 0, 0, 7); g.stroke();
  }
  g.restore();
}

// the teepee behind the flame (part of the static background)
function drawBackLogs(g) {
  log(g, 414, 662, 500, 684, 30, '#33263b', '#1f1729', { lines: [[-.2, .2, .8]] });
  log(g, 498, 690, 596, 650, 34, '#33263b', '#1f1729', { lines: [[-.3, .35, .85], [.25, .5, .9]] });
}
// the logs in front: drawn over the flame, so its base sits down inside the pile
function drawFrontLogs(g) {
  log(g, 392, 712, 520, 702, 36, '#4f4860', '#3c364c', { lines: [[.1, .12, .6]], grain: 'rgba(150,158,190,.45)' });
  log(g, 398, 684, 612, 706, 40, '#3b2937', '#1a1323', { cap: true, lines: [[-.35, .12, .45], [-.1, .5, .85], [.4, .3, .7]] });
}

// Smoke: a wide, soft column built from stacked passes (dim haze outside, a bright core
// running up its left side), streaked along the flow, dissolved into grain at the edges,
// and faded in where it leaves the fire.
// [width scale, shift of centre (fraction of half-width), colour]: many thin steps from a dim
// wide haze to a bright narrow core, so the layers blend instead of banding
let SMOKE_PASSES = [];
function buildSmokePasses() {
  const [lo, hi] = theme.smoke;
  SMOKE_PASSES = Array.from({ length: 12 }, (_, i) => {
    const k = i / 11, mix = j => Math.round(lo[j] + (hi[j] - lo[j]) * k);
    return [1.15 - k * .9, -.32 * k, `rgba(${mix(0)},${mix(1)},${mix(2)},${(.2 + .08 * (1 - k)).toFixed(2)})`];
  });
}
function drawSmoke(t) {
  // the layered body is drawn at half resolution, then blurred up so the layers melt together
  const b = smokeBase.getContext('2d');
  b.setTransform(1, 0, 0, 1, 0, 0); b.clearRect(0, 0, smokeBase.width, smokeBase.height);
  b.setTransform(dpr * scale / 2, 0, 0, dpr * scale / 2, dpr * ox / 2, dpr * oy / 2);
  const y0 = 610, top = VT - 80, N = Math.ceil((y0 - top) / 9);
  const cxAt = u => FIRE_X - 6 + u * .015
    + (3 + u * .05) * Math.sin(u * .009 - t * 1.3)
    + (2 + u * .02) * Math.sin(u * .021 - t * 2.1 + 1.3);
  const spine = [];
  for (let i = 0; i <= N; i++) {
    const u = (y0 - top) * i / N, x = cxAt(u), dx = (cxAt(u + 2) - cxAt(u - 2)) / 4, nl = Math.hypot(1, dx);
    const half = Math.min(118, 40 + u * .11) * (1 + .08 * Math.sin(u * .017 - t * 1.8));
    spine.push({ x, y: y0 - u, nx: 1 / nl, ny: dx / nl, half });
  }
  for (const [ws, shift, col] of SMOKE_PASSES) {
    // left edge going up, right edge coming back down; shift moves the pass off-centre
    const g = b, edge = (p, side) => { const h = p.half * ws * side + p.half * shift; return [p.x + h * p.nx, p.y + h * p.ny]; };
    g.beginPath();
    spine.forEach((p, i) => i ? g.lineTo(...edge(p, -1)) : g.moveTo(...edge(p, -1)));
    for (let i = spine.length - 1; i >= 0; i--) g.lineTo(...edge(spine[i], 1));
    g.closePath(); g.fillStyle = col; g.fill();
  }
  const g = smokeLayer.getContext('2d');
  g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, smokeLayer.width, smokeLayer.height);
  g.filter = `blur(${(7 * dpr * scale).toFixed(1)}px)`;
  g.drawImage(smokeBase, 0, 0, smokeLayer.width, smokeLayer.height);
  g.filter = 'none';
  toDesign(g);
  const drift = t * 38 % 256;
  // streaks running with the flow
  g.globalCompositeOperation = 'source-atop';
  g.save(); g.globalAlpha = .65; g.translate(0, -drift); g.fillStyle = streakPattern; g.fillRect(VL - 10, VT - 300, VR - VL + 20, VB - VT + 600); g.restore();
  // fade in above the fire
  g.globalCompositeOperation = 'destination-in';
  const fade = g.createLinearGradient(0, y0, 0, y0 - 230);
  fade.addColorStop(0, 'rgba(0,0,0,0)'); fade.addColorStop(.45, 'rgba(0,0,0,.45)'); fade.addColorStop(1, 'rgba(0,0,0,1)');
  g.fillStyle = fade; g.fillRect(VL - 10, VT - 100, VR - VL + 20, VB - VT + 200);
  // fine grain at device-pixel size, drifting upward with the smoke: dark specks erase,
  // light specks sparkle
  g.setTransform(1, 0, 0, 1, 0, 0);
  const dd = drift * dpr * scale % 256;
  g.save(); g.translate(0, -dd);
  g.globalCompositeOperation = 'destination-out'; g.fillStyle = smokeGrain.dark; g.fillRect(0, 0, smokeLayer.width, smokeLayer.height + 256);
  g.globalCompositeOperation = 'source-atop'; g.fillStyle = smokeGrain.light; g.fillRect(0, 0, smokeLayer.width, smokeLayer.height + 256);
  g.restore();
  g.globalCompositeOperation = 'source-over';
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.drawImage(smokeLayer, 0, 0);
}

// per-pixel noise tiles for the smoke: mostly faint, a few strong, so it reads as fine grain
function buildSmokeGrain(g) {
  const tile = (fn) => {
    const c = mkCanvas(256, 256), x = c.getContext('2d'), img = x.createImageData(256, 256), d = img.data;
    for (let i = 0; i < d.length; i += 4) { const [v, a] = fn(); d[i] = d[i + 1] = d[i + 2] = v; d[i + 3] = a; }
    x.putImageData(img, 0, 0); return g.createPattern(c, 'repeat');
  };
  return {
    dark: tile(() => [0, Math.random() ** 3 * 200]),
    light: tile(() => [240, Math.random() < .06 ? 60 + Math.random() * 110 : 0]),
  };
}

// short vertical light and dark strokes, tiled, for the smoke's streaky texture
function buildStreaks() {
  const c = mkCanvas(256, 256), g = c.getContext('2d');
  for (let i = 0; i < 900; i++) {
    const light = rnd() < .55;
    g.strokeStyle = light ? `rgba(236,242,255,${R(.12, .35)})` : `rgba(14,12,30,${R(.12, .35)})`;
    g.lineWidth = R(.6, 1.6);
    const x = R(0, 256), y = R(0, 256), len = R(6, 34);
    for (const oy of [0, -256, 256]) { g.beginPath(); g.moveTo(x, y + oy); g.lineTo(x + R(-1.5, 1.5), y + oy + len); g.stroke(); }
  }
  return c;
}

// as flat [x,y,x,y,...] outlines. Local space: base centre at (0,0), up is -y, ~200 tall.
// The bottom of each trace was hidden by logs in the source, so it's closed with a rounded bulb.

// closed Catmull-Rom spline through the traced points, so the polygon reads as a drawn curve
function smoothPath(pts, dy = 0) {
  const P = new Path2D(), n = pts.length / 2, X = i => pts[((i + n) % n) * 2], Y = i => pts[((i + n) % n) * 2 + 1] + dy;
  P.moveTo(X(0), Y(0));
  for (let i = 0; i < n; i++) {
    P.bezierCurveTo(X(i) + (X(i + 1) - X(i - 1)) / 6, Y(i) + (Y(i + 1) - Y(i - 1)) / 6,
                    X(i + 1) - (X(i + 2) - X(i)) / 6, Y(i + 1) - (Y(i + 2) - Y(i)) / 6, X(i + 1), Y(i + 1));
  }
  P.closePath(); return P;
}
// The lower body should stay one steady round bulb while only the top animates: ease every
// point below BULB.top onto a fixed oval (fully on it from the oval's centre down).
const BULB = { x: -2, y: -60, rx: 68, ry: 66, top: -125 };
function settleBase(f) {
  const out = f.slice();
  for (let i = 0; i < f.length; i += 2) {
    const x = f[i], y = f[i + 1];
    const u = Math.min(1, Math.max(0, (y - BULB.top) / (BULB.y - BULB.top))), w = u * u * (3 - 2 * u);
    if (!w) continue;
    const dx = x - BULB.x, dy = y - BULB.y;
    let tx, ty;
    if (dy < 0) {   // upper half: only pull the sides in/out to the oval's width at this height
      tx = BULB.x + Math.sign(dx || 1) * BULB.rx * Math.sqrt(Math.max(0, 1 - (dy / BULB.ry) ** 2)); ty = y;
    } else {        // lower half: project radially onto the oval
      const d = Math.hypot(dx / BULB.rx, dy / BULB.ry) || 1; tx = BULB.x + dx / d; ty = BULB.y + dy / d;
    }
    out[i] = x + (tx - x) * w; out[i + 1] = y + (ty - y) * w;
  }
  return out;
}
const FLAME_PATHS = FLAME_FRAMES.map(f => smoothPath(settleBase(f)));
const CORE_PATHS = CORE_FRAMES.map(f => smoothPath(f));

const FLAME_TIPS = FLAME_FRAMES.map(f => { let k = 1; for (let i = 3; i < f.length; i += 2) if (f[i] < f[k]) k = i; return [f[k - 1], f[k]]; });

const hash = (i, k) => { const x = Math.sin(i * 127.1 + k * 311.7) * 43758.5453; return x - Math.floor(x); };

function drop(g, x, y, s) {
  g.moveTo(x, y - s * 1.7);
  g.bezierCurveTo(x + s * 1.05, y - s * .5, x + s * .85, y + s, x, y + s);
  g.bezierCurveTo(x - s * .85, y + s, x - s * 1.05, y - s * .5, x, y - s * 1.7);

const FLAME_X = FIRE_X, FLAME_Y = 698;   // base sinks behind the front logs
const licks = [];
let lastFi = -1;
function drawFire(fi, flick) {
  const k = fi % FLAME_PATHS.length;   // the original's own order and timing: 12 drawings a second
  const sx = 1, sy = 1;
  const path = FLAME_PATHS[k], tip = FLAME_TIPS[k];

  // bits that break off the main tip and float up, stepped with the drawing
  if (fi !== lastFi) {
    lastFi = fi;
    for (let i = licks.length - 1; i >= 0; i--) {
      const l = licks[i]; l.y -= 15; l.x += l.dx; l.s *= .75;
      if (++l.age > 4) licks.splice(i, 1);
    }
    if (hash(fi, 11) < .35) licks.push({ x: FLAME_X + tip[0] * sx + (hash(fi, 13) * 2 - 1) * 5, y: FLAME_Y + tip[1] * sy - 16, s: 5 + hash(fi, 14) * 4, dx: (hash(fi, 15) * 2 - 1) * 3, age: 0 });
  }

  const g = fireLayer.getContext('2d');
  g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, fireLayer.width, fireLayer.height);
  toDesign(g);
  g.save(); g.translate(FLAME_X, FLAME_Y); g.scale(sx, sy);
  const fg = g.createLinearGradient(0, 0, 0, -200);
  fg.addColorStop(0, '#f2702e'); fg.addColorStop(.3, '#f98a36'); fg.addColorStop(.55, '#f5702b'); fg.addColorStop(1, '#df4a22');
  g.fillStyle = fg; g.fill(path);
  // soft-edged core: drawn with a same-colour shadow so it glows into the orange
  g.save(); g.clip(path);
  g.fillStyle = '#fcd03a'; g.shadowColor = '#fcd03a'; g.shadowBlur = 10 * dpr * scale;
  g.fill(CORE_PATHS[k]); g.restore();

  // the bulb over the logs: deepen toward red, then fade it so the logs read through
  g.globalCompositeOperation = 'source-atop';
  const tint = g.createLinearGradient(0, BULB.y - 10, 0, BULB.y + BULB.ry);
  tint.addColorStop(0, 'rgba(140,28,24,0)'); tint.addColorStop(1, 'rgba(140,28,24,.5)');
  g.fillStyle = tint; g.fillRect(-120, BULB.y - 10, 240, 120);
  g.globalCompositeOperation = 'destination-in';
  const fade = g.createLinearGradient(0, BULB.y - 20, 0, BULB.y + BULB.ry);
  fade.addColorStop(0, 'rgba(0,0,0,1)'); fade.addColorStop(.55, 'rgba(0,0,0,.72)'); fade.addColorStop(1, 'rgba(0,0,0,.5)');
  g.fillStyle = fade; g.fillRect(-300, -400, 600, 500);

  g.globalCompositeOperation = 'destination-out';
  g.save(); g.beginPath(); g.rect(-120, BULB.y, 240, 120); g.clip();
  g.globalAlpha = .55; g.translate(hash(fi, 42) * 256, hash(fi, 43) * 256);

  g.globalCompositeOperation = 'source-over';

  // print grain on the flame, shifted each step so it boils
  g.globalCompositeOperation = 'destination-out'; g.globalAlpha = .4;
  g.save(); g.translate(hash(fi, 40) * 256, hash(fi, 41) * 256);
  g.fillStyle = speckPattern; g.fillRect(-W, -H, W * 3, H * 3); g.restore();
  g.globalAlpha = 1; g.globalCompositeOperation = 'source-over';

  ctx.setTransform(1, 0, 0, 1, 0, 0);

  ctx.globalAlpha = .9;   // the back logs read faintly through the flame
  ctx.drawImage(fireLayer, 0, 0);
  ctx.restore();

}

const embers = [];
let emberClock = 0;
function drawEmbers(t, dt) {
  emberClock += dt;
  while (emberClock > .14) {
    emberClock -= .14;
    embers.push({ x: FIRE_X + R(-22, 22), y: 560 + R(-10, 20), vx: R(-12, 12), vy: -R(45, 95), life: 0, max: R(1.2, 2.6), s: R(1.4, 2.8), ph: R(0, 6) });
  }
  for (let i = embers.length - 1; i >= 0; i--) {
    const e = embers[i]; e.life += dt;
    if (e.life > e.max) { embers.splice(i, 1); continue; }
    e.x += (e.vx + Math.sin(t * 3 + e.ph) * 18) * dt; e.y += e.vy * dt;
    const k = 1 - e.life / e.max, fl = .6 + .4 * Math.sin(t * 20 + e.ph);
    ctx.fillStyle = `rgba(255,${150 + 60 * k | 0},70,${k * fl})`;
    ctx.fillRect(e.x, e.y, e.s, e.s * 1.4);
  }
}

  gl.addColorStop(0, `rgba(255,120,50,${.32 * flick * theme.glow})`); gl.addColorStop(.35, `rgba(220,90,40,${.12 * flick * theme.glow})`); gl.addColorStop(1, 'rgba(200,70,30,0)');
  ctx.fillStyle = gl; ctx.fillRect(0, 200, W, H);
  ctx.globalCompositeOperation = 'source-over';

  drawSmoke(t);
  toDesign(ctx);

  drawFire(Math.floor(t * 12), flick);
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(frontLogLayer, 0, 0); toDesign(ctx);

  drawEmbers(t, dt);

  // film grain
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalCompositeOperation = 'overlay'; ctx.globalAlpha = theme.grain;
  ctx.drawImage(grains[reduced ? 0 : Math.floor(t * 10) % grains.length], 0, 0, canvas.width, canvas.height);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';

}
function frame(now) { if (staticLayer) render(now); else if (innerWidth && innerHeight) resize(); requestAnimationFrame(frame); }

buildSmokePasses();

addEventListener('resize', resize);
resize();
requestAnimationFrame(frame);
window.renderAt = sec => { last = start + sec * 1000 - 16; render(start + sec * 1000); };
})();
</script>
</body>
</html>
